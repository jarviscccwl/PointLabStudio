name: Build native desktop packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: python -m pip install -r requirements-build.txt
      - name: Build macOS package
        if: runner.os == 'macOS'
        run: python packaging/build-native.py
      - name: Build Ubuntu 22.04-compatible package
        if: runner.os == 'Linux'
        run: |
          docker build -f packaging/Dockerfile.linux -t pointlab-build .
          docker run --rm --mount "type=bind,source=$PWD,target=/workspace" pointlab-build
      - uses: actions/upload-artifact@v4
        with:
          name: PointLabStudio-${{ matrix.runner }}
          path: dist/*
          if-no-files-found: error

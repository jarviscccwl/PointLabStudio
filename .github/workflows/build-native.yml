name: Build native desktop packages

on:
  workflow_dispatch:
  push:
    branches: [codex/release-v1.3.0]

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libxcb-cursor0 libvulkan1 libgomp1 libxerces-c-dev libglib2.0-0t64 libdbus-1-3 libfontconfig1 libfreetype6 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libusb-1.0-0 libgfortran5 libsm6 libice6
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build package
        run: python packaging/build-native.py
      - uses: actions/upload-artifact@v4
        with:
          name: PointLabStudio-${{ matrix.runner }}
          path: dist/*
          if-no-files-found: error

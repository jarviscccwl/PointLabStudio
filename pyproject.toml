[project]
name = "pointlab-studio"
version = "1.3.0"
description = "PointLabStudio — 桌面点云综合处理平台（PySide6 + pygfx）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.12,<2",
    "open3d>=0.18,<0.21",
    "PySide6>=6.6,<7",
    "pygfx>=0.4,<0.18",
    "wgpu>=0.17,<0.33",
    "rendercanvas>=2.7,<3",
    "mcap>=1.2,<2",
    "mcap-ros2-support>=0.5,<1",
    "lz4>=4.3,<5",
    "zstandard>=0.23,<1",
    "rosbags>=0.11,<0.12",
    "mcap-ros1-support>=0.9,<1",
    "Pillow>=11,<14",
    "PyYAML>=6,<7",
    "opencv-python-headless>=4.10,<6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
